name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # This repo is the org site (stacx-lab.github.io); Kinex lives under /kinex/.
      - run: npm run check
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: /kinex
      # Publish dist/ under kinex/; the root keeps only a 404 page.
      - run: |
          mkdir -p _site/kinex
          cp -r dist/. _site/kinex/
          cp dist/404.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
