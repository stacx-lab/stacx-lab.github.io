name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # This organization-site repository serves Kinex from a subdirectory.
      - run: npm run check
        env:
          SITE_URL: https://stacx-lab.github.io
          BASE_PATH: /kinex
      # A real directory also lets Pages redirect /kinex to /kinex/.
      - name: Stage the Pages site
        run: |
          mkdir -p _site/kinex
          cp -R dist/. _site/kinex/
          cp dist/404.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://stacx-lab.github.io/kinex/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
